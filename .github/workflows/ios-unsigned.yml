name: Build iPhone Login Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ForestAccounts/**'
      - 'ForestAccounts.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: read

concurrency:
  group: ios-login-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Read source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build unsigned iPhone app
        shell: bash
        run: bash scripts/build-unsigned.sh

      - name: Downloadable unsigned IPA and instructions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ForestAccounts-UNSIGNED-iPhone
          path: build-output/
          if-no-files-found: error
          retention-days: 7

      - name: Compilation log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ForestAccounts-build-failure
          path: build-output/build.log
          if-no-files-found: ignore
          retention-days: 7
